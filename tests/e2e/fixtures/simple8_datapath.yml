    - { label: "Fetch", x: 95 }
    - { label: "Decode", x: 285 }
    - { label: "Execute", x: 485 }
    - { label: "Write Back", x: 855 }
  separators: [182, 382, 592]
  pipeRegs:
    - { x: 176, label: "IF/ID" }
    - { x: 376, label: "ID/EX" }
    - { x: 586, label: "EX/WB" }
  wires:
    - { points: "58,210 78,210", stage: "IF" }
    - { points: "148,210 228,210", stage: "ID" }
    - { points: "318,210 470,210", stage: "EX" }
    - { points: "540,210 800,210", stage: "WB" }
  blocks:
    - { id: pc,      stage: IF, geom: { kind: rect, x: 26, y: 190, w: 34, h: 44, rx: 3 }, label: PC,       labelPos: { x: 43, y: 216 },  color: green,   qmark: { x: 64, y: 186 } }
    - { id: imem,    stage: IF, geom: { kind: rect, x: 78, y: 178, w: 70, h: 68, rx: 4 }, label: IMem,     labelPos: { x: 113, y: 216 }, color: red }
    - { id: regfile, stage: ID, geom: { kind: rect, x: 228, y: 160, w: 90, h: 90, rx: 4 }, label: "Reg File", labelPos: { x: 273, y: 208 }, color: greenlt, qmark: { x: 322, y: 156 } }
