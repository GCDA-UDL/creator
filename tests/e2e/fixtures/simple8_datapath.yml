    - { id: dmem,    stage: WB, geom: { kind: rect, x: 760, y: 176, w: 84, h: 68, rx: 4 }, label: DataMem, labelPos: { x: 802, y: 214 }, color: red }
  help:
    pc:  { title: "PC", desc: "Holds the current instruction address.", look: "Advances each step." }
    alu: { title: "ALU", desc: "Computes the result.", look: "Lights up in Execute." }
  values:
    - { kind: operand, role: rs1, x: 196, y: 150 }
    - { kind: operand, role: rd,  x: 196, y: 170 }
  destRoles: ["rd"]
  srcRegRole: "rs2"
  wb: { x: 802, y: 270 }
  aluResult: { x: 556, y: 200 }
